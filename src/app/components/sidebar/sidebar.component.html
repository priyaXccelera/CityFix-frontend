<aside class="fixed inset-y-0 z-20 hidden w-64 bg-ink p-5 text-slate-300 lg:block"><a routerLink="/dashboard" class="mb-10 flex items-center gap-3 text-xl font-bold text-white"><span class="grid h-9 w-9 place-items-center rounded-lg bg-primary">C</span>CityFix</a><nav class="space-y-1">@for (item of navItems; track item.to) { @if (item.roles.includes(auth.currentRole() ?? '')) { <a [routerLink]="item.to" routerLinkActive="bg-white/10 text-white" class="block rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-white/5">{{ item.label }}</a> } }</nav><button (click)="logout()" class="absolute bottom-6 rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/10">Sign out</button></aside>
