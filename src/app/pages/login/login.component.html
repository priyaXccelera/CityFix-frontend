<div class="grid min-h-screen place-items-center p-5">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <a routerLink="/login" class="mb-8 flex items-center gap-2 text-2xl font-bold"><span class="rounded-lg bg-primary px-3 py-1 text-white">C</span>CityFix</a>
    <h1 class="text-2xl font-bold">Choose how to sign in</h1>
    <p class="mb-6 mt-2 text-sm text-muted">Use the workspace that matches your CityFix responsibilities.</p>

    <div class="mb-6 grid grid-cols-2 gap-3" aria-label="Account type">
      <button type="button" (click)="selectRole('USER')" [class.border-primary]="selectedRole() === 'USER'" [class.bg-blue-50]="selectedRole() === 'USER'" [class.text-primary]="selectedRole() === 'USER'" class="rounded-xl border border-slate-200 p-3 text-left text-sm font-semibold">
        <span class="block">Resident</span><span class="mt-1 block text-xs font-normal text-muted">Report and follow issues</span>
      </button>
      <button type="button" (click)="selectRole('ADMIN')" [class.border-primary]="selectedRole() === 'ADMIN'" [class.bg-blue-50]="selectedRole() === 'ADMIN'" [class.text-primary]="selectedRole() === 'ADMIN'" class="rounded-xl border border-slate-200 p-3 text-left text-sm font-semibold">
        <span class="block">Administrator</span><span class="mt-1 block text-xs font-normal text-muted">Manage city operations</span>
      </button>
    </div>

    @if (error()) { <p role="alert" class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-danger">{{ error() }}</p> }
    @if (success()) { <p role="status" class="mb-4 rounded-lg bg-green-50 p-3 text-sm text-success">{{ success() }}</p> }

    <label class="mb-4 block text-sm font-medium">Email<input formControlName="email" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" type="email" autocomplete="email" /></label>
    <label class="block text-sm font-medium">Password<input formControlName="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" type="password" autocomplete="current-password" /><span class="mt-1 block text-xs text-muted">At least 6 characters.</span></label>
    <a routerLink="/forgot-password" class="mt-3 block text-sm text-primary">Forgot password?</a>
    <button [disabled]="form.invalid || submitting()" type="submit" class="mt-6 w-full rounded-lg bg-primary py-2.5 font-semibold text-white disabled:cursor-not-allowed disabled:opacity-60">{{ submitting() ? 'Signing in…' : 'Sign in as ' + (selectedRole() === 'ADMIN' ? 'administrator' : 'resident') }}</button>
    <p class="mt-3 text-center text-xs text-muted">The selected demo account is prefilled for testing.</p>
    <p class="mt-5 text-center text-sm text-muted">New here? <a routerLink="/signup" class="font-semibold text-primary">Create a resident account</a></p>
  </form>
</div>
