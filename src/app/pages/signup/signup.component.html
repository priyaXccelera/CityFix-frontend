<div class="grid min-h-screen place-items-center p-5"><form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-full max-w-lg rounded-2xl bg-white p-8 shadow-xl"><a routerLink="/login" class="text-2xl font-bold text-primary">CityFix</a><h1 class="mt-6 text-2xl font-bold">Create your account</h1>@if (error()) { <p class="mt-4 text-sm text-danger">{{ error() }}</p> }<div class="mt-5 grid gap-4 sm:grid-cols-2">@for (field of ['name','email','area','phone']; track field) { <label class="text-sm font-medium">{{ field === 'area' ? 'Address / area' : field }}<input [formControlName]="field" [type]="field === 'email' ? 'email' : 'text'" class="mt-1 w-full rounded-lg border p-2" /></label> }<label class="text-sm font-medium">Password<input formControlName="password" type="password" class="mt-1 w-full rounded-lg border p-2" /><span class="mt-1 block text-xs text-muted">At least 6 characters.</span></label></div><button [disabled]="form.invalid" type="submit" class="mt-6 w-full rounded-lg bg-primary py-2.5 font-semibold text-white">Create account</button><p class="mt-4 text-center text-sm">Already registered? <a routerLink="/login" class="text-primary">Sign in</a></p></form></div>
