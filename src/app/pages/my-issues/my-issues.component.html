<h1 class="text-3xl font-bold">My reports</h1><p class="mt-2 text-muted">Track progress on issues you have submitted.</p>@if(loading()){<div class="mt-6 h-32 animate-pulse rounded-xl bg-slate-200"></div>}@else if(!issues().length){<div class="mt-6 rounded-xl bg-white p-8 text-center">No reports yet — <a routerLink="/report-issue" class="text-primary">create one</a>.</div>}@else{<div class="mt-6 grid gap-4">@for(issue of issues();track issue.id){<button (click)="open(issue.id)" class="rounded-xl bg-white p-5 text-left shadow-sm hover:ring-2 hover:ring-primary"><div class="flex justify-between gap-4"><div><p class="font-semibold">{{issue.title}}</p><p class="mt-1 text-sm text-muted">{{issue.location}} · {{issue.createdAt | date:'mediumDate'}}</p></div><span class="h-fit rounded-full bg-accent px-3 py-1 text-xs font-semibold text-primary">{{issue.status}}</span></div></button>}</div>}
