<section class="mx-auto max-w-2xl"><a routerLink="/dashboard" class="text-sm font-semibold text-primary">← Dashboard</a><h1 class="mt-4 text-3xl font-bold">Report an issue</h1><p class="mt-2 text-muted">Give the city team enough detail to investigate.</p>@if(success()){<p class="mt-4 rounded-lg bg-green-50 p-3 text-success">{{success()}}</p>}<form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-6 space-y-4 rounded-xl bg-white p-6 shadow-sm"><label class="block text-sm font-medium">Issue title<input formControlName="title" class="mt-1 w-full rounded-lg border p-2" /></label><label class="block text-sm font-medium">Category<select formControlName="category" class="mt-1 w-full rounded-lg border p-2"><option value="">Select category</option>@for(category of categories();track category.id){<option [value]="category.name">{{category.name}}</option>}</select></label><label class="block text-sm font-medium">Location<input formControlName="location" class="mt-1 w-full rounded-lg border p-2" placeholder="Area, street, landmark" /></label><label class="block text-sm font-medium">Description<textarea formControlName="description" rows="5" class="mt-1 w-full rounded-lg border p-2"></textarea></label><label class="block text-sm font-medium">Photo reference <span class="font-normal text-muted">(optional)</span><input formControlName="photoReference" class="mt-1 w-full rounded-lg border p-2" placeholder="Photo URL or reference" /></label><button [disabled]="form.invalid" type="submit" class="rounded-lg bg-primary px-5 py-2.5 font-semibold text-white">Submit report</button></form></section>
