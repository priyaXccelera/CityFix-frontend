<div class="flex justify-between"><div><h1 class="text-3xl font-bold">Browse city issues</h1><p class="mt-2 text-muted">See reports from your community.</p></div><a routerLink="/report-issue" class="h-fit rounded-lg bg-primary px-4 py-2 text-white">Report issue</a></div>@if(loading()){<div class="mt-6 h-40 animate-pulse rounded-xl bg-slate-200"></div>}@else{<div class="mt-6 grid gap-4 md:grid-cols-2">@for(issue of issues();track issue.id){<article class="rounded-xl bg-white p-5 shadow-sm"><button (click)="open(issue.id)" class="text-left"><p class="font-bold">{{issue.title}}</p><p class="mt-2 text-sm text-muted">{{issue.description}}</p><p class="mt-3 text-sm text-muted">{{issue.category}} · {{issue.location}}</p></button><div class="mt-4 flex items-center justify-between"><span class="rounded-full bg-accent px-3 py-1 text-xs text-primary">{{issue.status}}</span><button (click)="upvote(issue.id)" class="rounded-lg border px-3 py-1.5 text-sm font-semibold text-primary">▲ {{issue.upvotes}}</button></div></article>}</div>}
